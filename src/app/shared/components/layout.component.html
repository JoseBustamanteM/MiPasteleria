<div class="min-h-screen bg-rose-50 flex flex-col">
      <!-- Header -->
      <header class="bg-white shadow-sm sticky top-0 z-10 border-b border-rose-100">
        <div class="max-w-lg mx-auto px-4 py-3 flex items-center justify-between">
          <div class="flex items-center gap-2">
            <span class="text-2xl">🧁</span>
            <h1 class="text-lg font-bold text-rose-700 font-serif">Mi Pastelería</h1>
          </div>
          <button
            (click)="signOut()"
            class="text-sm text-rose-400 hover:text-rose-600 flex items-center gap-1 px-3 py-1.5 rounded-lg hover:bg-rose-50 transition-colors"
          >
            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
            </svg>
            Salir
          </button>
        </div>
      </header>

      <!-- Content -->
      <main class="flex-1 max-w-lg mx-auto w-full px-4 py-6 pb-24">
        <router-outlet />
      </main>

      <!-- Bottom Navigation -->
      <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-rose-100 shadow-lg z-10">
        <div class="max-w-lg mx-auto flex">
          <a routerLink="/dashboard" routerLinkActive="text-rose-600 bg-rose-50"
            class="flex-1 flex flex-col items-center justify-center py-3 gap-1 text-gray-400 hover:text-rose-500 transition-colors rounded-tl-xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
            </svg>
            <span class="text-xs font-medium">Ventas</span>
          </a>
          <a routerLink="/catalogo" routerLinkActive="text-rose-600 bg-rose-50"
            class="flex-1 flex flex-col items-center justify-center py-3 gap-1 text-gray-400 hover:text-rose-500 transition-colors rounded-tr-xl">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
            </svg>
            <span class="text-xs font-medium">Catálogo</span>
          </a>
          <a routerLink="/clientes" routerLinkActive="text-rose-600 bg-rose-50"
            class="flex-1 flex flex-col items-center justify-center py-3 gap-1 text-gray-400 hover:text-rose-500 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span class="text-xs font-medium">Clientes</span>
          </a>
        </div>
      </nav>
    </div>
